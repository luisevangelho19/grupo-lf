name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cleanup workspace (remove previous artifacts)
        run: |
          echo "Cleaning potential residual artifacts (.next / node_modules)"
          rm -rf .next || true
          rm -rf node_modules || true
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint (skip if not configured)
        run: npm run lint || echo 'eslint skipped or not configured'

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests (CI)
        run: npm run test:ci

      - name: Build
        env:
          NEXT_PUBLIC_SITE_WHATSAPP_NUMBER: 5562991157746
        run: npm run build

      - name: JSON-LD smoke validation
        run: npm run jsonld-validate

      - name: Post-build sitemap
        if: success()
        run: npm run postbuild || echo 'next-sitemap not configured'

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse CI (skeleton)
        run: |
          echo "Lighthouse CI job placeholder — configure LHCI or similar here"
